name: best_viewer
description: Local-first multimedia reader and indexed library manager.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  liquid_glass_widgets: 1.6.1
  flutter:
    sdk: flutter
  archive: ^4.0.9
  path: ^1.9.1
  xml: ^7.0.1
  path_provider: ^2.1.5
  image: ^4.9.1
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.34
  url_launcher: ^6.3.2
  media_kit: ^1.2.6
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  pdfrx: ^2.4.7
  charset: ^2.0.1
  flex_color_scheme: ^8.4.0
  responsive_framework: ^1.5.1
  smooth_sheets: ^1.0.3
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
